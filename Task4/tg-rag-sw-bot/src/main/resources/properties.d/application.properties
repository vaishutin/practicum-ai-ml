spring.application.name=tg-rag-sw-bot

# --- server ---
server.port=8001

# --- telegram ---
# \u0432 .env/.env.secrets
app.telegram.username=${TELEGRAM_BOT_USERNAME:}
app.telegram.token=${TELEGRAM_BOT_TOKEN:}

# --- rag-api ---
# \u0432 application-docker.properties \u043F\u0435\u0440\u0435\u043E\u043F\u0440\u0435\u0434\u0435\u043B\u044F\u0435\u0442\u0441\u044F \u043D\u0430 http://rag-api:8000
app.rag.base-url=${RAG_BASE_URL:http://localhost:8000}

app.rag.timeout.connect-ms=3000
app.rag.timeout.read-ms=15000

app.telegram.max-message-chars=4000